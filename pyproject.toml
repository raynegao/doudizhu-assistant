[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "data",
  "logs",
  "models",
  "runs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
exclude = "^(data|logs|models|runs)/"

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src", "scripts"]
omit = [
  "src/vision/macos_vision_ocr.swift",
]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
